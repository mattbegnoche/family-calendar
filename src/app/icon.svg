<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Family Calendar">
  <!--
    Lucide `calendar` (v1.39.0, ISC) on the app's own indigo to violet ramp:
    #4f46e5 is the "Everyone" member colour and the app's primary token,
    #7c3aed is Lacy's. Same geometry lucide-react renders at runtime.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="16" fill="url(#ring)" />

  <!-- 24px icon scaled to 0.8 and centred: content spans 7.76–24.24 on both axes. -->
  <g transform="translate(6.4 6.8) scale(0.8)"
     fill="none"
     stroke="#ffffff"
     stroke-width="2.6"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M8 2v3" />
    <path d="M16 2v3" />
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M3 9h18" />
  </g>
</svg>
